[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gemini-antigravity-bridge"
version = "1.0.0"
description = "Bridges cloud-based AI orchestrators with local systems, terminal execution, and autonomous tasks via MCP."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Nandhakumar Murugan" }
]
dependencies = [
    "mcp>=1.0.0",
    "uvicorn>=0.30.0",
    "starlette>=0.38.0",
    "fastapi>=0.115.0",
    "python-dotenv>=1.0.0",
    "pyngrok>=7.2.0",
    "psutil>=5.9.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[project.scripts]
gemini-bridge = "server:main"
