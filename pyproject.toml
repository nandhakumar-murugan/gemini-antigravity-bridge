[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-antigravity-bridge"
version = "1.0.0"
description = "Bidirectional Model Context Protocol (MCP) bridge connecting Google Gemini Spark with DeepMind Antigravity"
readme = "README.md"
authors = [
    { name = "Nandhakumar Murugan", email = "smnk2006@gmail.com" }
]
license = { text = "Apache-2.0" }
keywords = ["mcp", "model-context-protocol", "gemini", "antigravity", "deepmind", "ai-agents", "google-workspace"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Build Tools",
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "starlette>=0.36.0",
    "uvicorn>=0.27.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
    "pyngrok>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/nandhakumar-murugan/gemini-antigravity-bridge"
Repository = "https://github.com/nandhakumar-murugan/gemini-antigravity-bridge.git"
Issues = "https://github.com/nandhakumar-murugan/gemini-antigravity-bridge/issues"

[project.scripts]
gemini-bridge = "run_with_tunnel:main"
gemini-antigravity-bridge = "run_with_tunnel:main"
