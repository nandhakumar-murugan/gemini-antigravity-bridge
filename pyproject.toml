[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gemini-antigravity-bridge"
version = "1.2.0"
description = "Bidirectional Model Context Protocol (MCP) bridge connecting Google Gemini Spark with DeepMind Antigravity"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Nandhakumar Murugan", email = "smnk2006@gmail.com" }
]
dependencies = [
    "mcp>=1.0.0",
    "uvicorn>=0.30.0",
    "starlette>=0.38.0",
    "fastapi>=0.115.0",
    "python-dotenv>=1.0.0",
    "pyngrok>=7.2.0",
    "psutil>=5.9.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pyautogui>=0.9.54",
    "Pillow>=10.0.0",
    "pywin32>=306",
]

[project.scripts]
gemini-bridge = "server:main"

